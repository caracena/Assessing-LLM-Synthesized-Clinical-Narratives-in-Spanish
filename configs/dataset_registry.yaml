# Dataset catalog for local BRAT corpora, train-only generation seeds, and downstream benchmarks.
# Consumed by scripts/dataset_registry.py and downstream evaluation scripts.

datasets:
  # --- Restricted / institutional corpora ---
  carmen_i:
    format: brat
    path: ~/datasets/carmen/CARMEN-I/ann/masked/ner
    split: {mode: auto, seed: 42, file: configs/splits/carmen_i__seed42.json}
    evaluation: {task: ner}
    generation: {seed_policy: excluded}

  achs:
    format: brat
    path: ~/datasets/achs/masked_achs-privacy_corpus
    split: {mode: auto, seed: 42, file: configs/splits/achs__seed42.json}
    evaluation: {task: ner}
    generation: {seed_policy: train}

  achs_pseudo:
    format: txt_dir
    path: ~/datasets/ACHS_pseudo
    split: {mode: none}
    generation:
      seed_policy: file:configs/seeds/achs_pseudo__train_only.json
      style: normalize_case

  # --- Open clinical seed corpora (IIC/ClinText-SP) ---
  cantemist:
    format: huggingface
    repo: IIC/ClinText-SP
    evaluation: {task: ner}
    generation: {seed_policy: all}

  meddoplace:
    format: huggingface
    repo: IIC/ClinText-SP
    evaluation: {task: ner}
    generation: {seed_policy: all}

  livingner:
